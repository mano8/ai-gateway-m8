# The credentials package is the one place allowed to import the credential
# version model. It inherits every other setting from the repository root, and
# the auth-sdk-m8 ban stays in force here.
extend = "../../ruff.toml"

[lint.flake8-tidy-imports.banned-api]
"auth_sdk_m8".msg = "auth-sdk-m8 must never be imported directly by service code. Use fastapi-m8's re-exports instead."
