# Alembic configuration for ai_gateway.
#
# Migrations are packaged with the image from revision one (alembic/versions/
# is committed, never generated at start). Only the ai-migrate one-shot
# (scripts/ai_migrate.sh) runs Alembic; the web and scheduler run-modes only
# read the version table (ai_gateway/prestart.py).

[alembic]
script_location = %(here)s/alembic
version_locations = %(here)s/alembic/versions
version_table = alembic_version_ai
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
