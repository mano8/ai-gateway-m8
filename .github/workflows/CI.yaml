name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install lint tools
        run: pip install ruff==0.17.0

      - name: Check formatting
        run: ruff format --check .

      # Includes TID251: no auth_sdk_m8 import in service code, and the
      # credential-version model only inside ai_gateway/credentials/.
      - name: Lint
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r ai_gateway/requirements_dev.txt

      - name: Type check ai_gateway
        run: mypy ai_gateway --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install bandit and pip-audit
        run: pip install "bandit>=1.9.4" "pip-audit>=2.7.3"

      - name: Run bandit (no MEDIUM/HIGH issues)
        run: bandit -r ai_gateway --severity-level medium

      - name: Run pip-audit on the shipped lock
        run: pip-audit --require-hashes --disable-pip -r ai_gateway/requirements_prod.lock

      - name: Trivy filesystem scan (CRITICAL/HIGH CVEs and secrets)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite runs against a real PostgreSQL: tests/pg_harness.py creates
      # the ai_owner/ai_runtime roles and a fresh test database.
      AI_GATEWAY_TEST_PG_ADMIN_URL: postgresql://postgres:ci-only-postgres@127.0.0.1:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ai_gateway/requirements_dev.txt

      - name: Install dependencies
        run: pip install -r ai_gateway/requirements_dev.txt

      # Self-contained: tests/conftest.py sets every required variable before
      # importing ai_gateway, so no .env file is needed. pytest.ini enforces
      # branch coverage at 100%.
      - name: Run tests
        run: pytest --cov-report=xml

  test-shipped-lock:
    name: Tests against the shipped prod lock
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite runs against a real PostgreSQL: tests/pg_harness.py creates
      # the ai_owner/ai_runtime roles and a fresh test database.
      AI_GATEWAY_TEST_PG_ADMIN_URL: postgresql://postgres:ci-only-postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      # A lock regenerated beside a local checkout records a --find-links or a
      # file path; refuse it before anything else can pass on it.
      - name: Refuse a lock that is not a PyPI-only resolve
        run: |
          if grep -nE -- '--find-links|--extra-index-url|file://|^-e ' ai_gateway/requirements_prod.lock; then
            echo "requirements_prod.lock is not a portable PyPI-only resolve" >&2
            exit 1
          fi

      - name: Install the shipped set exactly as the Dockerfile does
        run: pip install --require-hashes -r ai_gateway/requirements_prod.lock

      - name: Add test tooling without moving the shipped set
        run: |
          pip freeze > lock-constraints.txt
          pip install -c lock-constraints.txt pytest pytest-cov coverage ruff==0.17.0
          pip check

      - name: Run tests against the shipped set
        run: pytest -p no:cacheprovider

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ai_gateway/Dockerfile

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ai_gateway/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-gateway-m8:ci-scan

      - name: Trivy image scan (CRITICAL/HIGH CVEs — blocks PR on findings)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: image
          image-ref: ai-gateway-m8:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
