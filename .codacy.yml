---
engines:
  bandit:
    enabled: true
  ruff:
    enabled: true
  markdownlint:
    enabled: true
  hadolint:
    enabled: true
  pylint:
    enabled: false
  prospector:
    enabled: false
  pydocstyle:
    enabled: false
  pycodestyle:
    enabled: false
  pyflakes:
    enabled: false

exclude_paths:
  - "tests/**"
  - "dist/**"
  - "*.egg-info/**"
  - ".pytest_cache/**"
  - "**/__pycache__/**"
  - "**/alembic/versions/**"
  - "docker_compose/**"
  # SECURITY.md is kept markdownlint-clean by hand; Codacy's prose analyzer
  # misclassifies a security policy document (standard acronyms flagged as
  # undefined on every revision).
  - "SECURITY.md"
  # The repository-context template files are frozen: their bytes are pinned
  # by the workspace rollout record, so they are not analysed as prose.
  - "AGENTS.md"
  - "CLAUDE.md"
  - "REPOSITORY_CONTEXT.md"
